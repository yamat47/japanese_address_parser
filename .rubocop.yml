inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  EnabledByDefault: true
  TargetRubyVersion: 3.2

Metrics/BlockLength:
  Exclude:
    - japanese_address_parser.gemspec
    - spec/**/*_spec.rb
    # v4 の逐語移植では上流 JS の巨大なコールバック（getTownRegexPatterns 等）をそのまま写す。
    - lib/japanese_address_parser/**/*.rb

# v4 リアーキの lib は上流 JS の逐語移植（working_agreement §3）。メソッド構成・
# 複雑度・モジュール長は移植元 JS に合わせるため、これらの Metrics を v4 では緩める。
# （from_json のフィールドマッピングや japanese_numeral の漢数字変換ロジック等。）
Metrics/MethodLength:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Metrics/AbcSize:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Metrics/PerceivedComplexity:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Metrics/ModuleLength:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# v4 の逐語移植では、移植元 JS の構造をそのまま写すため通常の定数参照・
# 行内プロバナンスコメント（# JS: ...）・JS falsy 再現の `== 0` 比較を許容する。
Lint/ConstantResolution:
  Exclude:
    - lib/japanese_address_parser/**/*.rb
    - lib/japanese_address_parser.rb

Style/InlineComment:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Style/NumericPredicate:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# v4 は JS の関数名（getPrefectures 等）をそのまま get_* に移植するため許容する。
Naming/AccessorMethodName:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# v4 は正規表現を文字列レベルで逐語コピーする（§3-1）。上流が文字クラス内に
# リテラル `|` を含める癖（例: /[都|道|府|県]$/）もそのまま移植するため許容する。
Lint/DuplicateRegexpCharacterClassElement:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# 同じく §3-1 の逐語コピーのため、上流の冗長なエスケープ（例: 文字クラス内の `\-`）も
# そのまま写すのを許容する。
Style/RedundantRegexpEscape:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# v4 は JS の `array[0]` / `a && a.b` / import 順もそのまま写すため lib では緩める。
Style/ArrayFirstLast:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Style/SafeNavigation:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

Style/RequireOrder:
  Exclude:
    - lib/japanese_address_parser/**/*.rb
    - lib/japanese_address_parser.rb

# jis_dai2 の異体字辞書は上流 dict.ts のデータの逐語移植なので許容する。
Metrics/CollectionLiteralLength:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# Data.define したクラスの再オープン（Steep 対応。クラスメソッドだけを追加するケース）を
# 「クラスメソッドのみのクラス」と誤認して module 化を提案するため lib では緩める。
Style/StaticClass:
  Exclude:
    - lib/japanese_address_parser/**/*.rb

# キー欠落を黙って nil にせず例外にしたい箇所で Hash#fetch を意図的に使うため無効化する。
Style/HashLookupMethod:
  Enabled: false

# 開発依存は従来どおり gemspec で管理する（Gemfile への移行はしない）。
Gemspec/DevelopmentDependencies:
  Enabled: false

# contextの記述を日本語で記述するのを許容する。
RSpec/ContextWording:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

# spec は上流テストファイル・ドメイン単位の命名（addresses_spec 等）で、クラスの
# 名前空間をパスに写さない（spec/japanese_address_parser/... 形式にしない）ため無効化。
RSpec/SpecFilePathFormat:
  Exclude:
    - spec/**/*_spec.rb

# addresses_spec は上流 addresses.test.ts の逐語移植で、CSV の行ごとに describe 直下で
# 期待値を組み立てて example を生成するデータ駆動形式のため、この cop の警告対象になる。
# 各変数はイテレーションごとに束縛され example 実行前に変更されないのでリークしない。
RSpec/LeakyLocalVariable:
  Exclude:
    - spec/addresses_spec.rb

# level1 / level3 の数字は位置情報レベル（level: 1 / 3）というドメインの値を指すため許容する。
RSpec/IndexedLet:
  Exclude:
    - spec/normalize_result_point_spec.rb

# filesystem_api_spec は CDN から tmpdir へ一度だけ DL するため before/after(:context) を使う。
# 状態（Config / モジュールキャッシュ）は around で example ごとに復元・reset し、tmpdir は
# after(:context) で削除するので、本 cop が警告する状態リークは管理済み。
RSpec/BeforeAfterAll:
  Exclude:
    - spec/filesystem_api_spec.rb

# MITなのでファイルの著作権は記載しない。
Style/Copyright:
  Enabled: false

# コメントを日本語で記述するのを許容する。
Style/AsciiComments:
  Enabled: false

Style/StringHashKeys:
  Exclude:
    # 配信 API の JSON（文字列キー）を from_json に渡すため日本語/文字列キーのハッシュを許容する。
    - spec/data/single_city_spec.rb
    - spec/data/single_prefecture_spec.rb
    - spec/city_spec.rb
    - spec/address_spec.rb
    - spec/match_close_to_spec.rb
    - spec/cache_regexes_subresource_spec.rb
    - spec/data/single_machi_aza_spec.rb
    - spec/data/single_rsdt_spec.rb
    - spec/data/single_chiban_spec.rb
    - spec/utils_spec.rb

    # HTTP ヘッダ名・クエリ名は文字列キーが自然なので許容する。
    - spec/fetcher_spec.rb

    # from_json に配信 API の JSON（文字列キー）を渡すため許容する。
    - spec/normalize_result_point_spec.rb

    # 漢数字⇔数値の辞書は日本語の文字をキーにするため文字列キーのハッシュを許容する。
    - lib/japanese_address_parser/**/*.rb

# elseがない場合にはcase文ではなくif文を許容する。
Style/MissingElse:
  EnforcedStyle: case

Gemspec/DependencyVersion:
  EnforcedStyle: forbidden
